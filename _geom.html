<!doctype html><html><head><meta charset="utf-8"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/style-home.css"></head><body style="margin:0"><header class="main-header"><nav class="navbar"></nav></header><section class="hero"><div class="slider-container"><div class="slide active"><div class="slide-image-wrapper"><img src="https://i.imgur.com/nrW9elB.png"></div></div></div></section><script>window.addEventListener('load',()=>{setTimeout(()=>{var s=document.querySelector('.slider-container').getBoundingClientRect();var w=document.querySelector('.slide-image-wrapper').getBoundingClientRect();var im=document.querySelector('.slide img');var ir=im.getBoundingClientRect();var cs=getComputedStyle(im);document.title='win='+innerWidth+'x'+innerHeight+'|ctr='+[Math.round(s.x),Math.round(s.y),Math.round(s.width),Math.round(s.height)].join(',')+'|wra='+[Math.round(w.x),Math.round(w.y),Math.round(w.width),Math.round(w.height)].join(',')+'|im='+[Math.round(ir.x),Math.round(ir.y),Math.round(ir.width),Math.round(ir.height)].join(',')+'|objPos='+cs.objectPosition+'|tOrigin='+cs.transformOrigin;},400);})</script></body></html>
